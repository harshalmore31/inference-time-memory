name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and dev tools
        run: pip install -e .[dev]

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Type check (mypy, non-blocking)
        continue-on-error: true
        run: mypy itm

      # test_gpt.py is excluded: it downloads a multi-GB BGE-M3 model and
      # needs network access. The tests/ suite runs on a deterministic
      # FakeEmbedder and is fully offline.
      - name: Unit tests (pytest)
        run: pytest -q tests
